name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain setup: the orchestrator adds the steps the stack needs
      # (oven-sh/setup-bun, dtolnay/rust-toolchain, actions/setup-go, ...).
      - name: deterministic check
        run: bash scripts/check.sh
