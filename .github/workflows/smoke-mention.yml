name: smoke-mention
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to comment on
        required: true
        type: string
jobs:
  mention:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number('${{ inputs.issue_number }}')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: '@olucasandrade GHN smoke mention — low-noise verification ping. Safe to ignore/close.'
            })
